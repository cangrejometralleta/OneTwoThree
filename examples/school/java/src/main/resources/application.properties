# The Deployment Values Live in ../config, Validated before this File Loads.
# Only what Spring itself Needs Appears here, and no Secret Appears at all.
spring.datasource.url=jdbc:h2:file:./${school.database.path:school.db}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.main.banner-mode=off
